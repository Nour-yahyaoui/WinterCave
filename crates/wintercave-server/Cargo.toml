[package]
name = "wintercave-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WinterCave's local server on actix-web: the built app plus a path-confined file API"

[lib]
name = "wintercave_server"
path = "src/lib.rs"

[[bin]]
name = "wintercave-server"
path = "src/main.rs"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
