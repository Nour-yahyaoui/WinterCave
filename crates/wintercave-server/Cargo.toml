[package]
name = "wintercave-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WinterCave: the editor page and file API, served locally by actix-web"

[lib]
name = "wintercave_server"
path = "src/lib.rs"

[[bin]]
name = "wintercave-server"
path = "src/main.rs"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wintercave-core = { path = "../wintercave-core" }
