name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust (tests, live HTTP, release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting report
        # A report, not a gate: this code is authored without a local toolchain,
        # so rustfmt cannot run where it is written. The diff is printed here so
        # a contributor with cargo can apply it.
        run: |
          cargo fmt --all
          git diff --stat || true
      - name: Unit, integration and live HTTP tests
        run: cargo test --workspace --all-targets
      - name: Release build
        run: cargo build --release -p wintercave-server
      - name: Report the binary size
        run: ls -l target/release/wintercave-server && du -h target/release/wintercave-server

  wasm:
    name: WebAssembly bindings (compile only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The browser no longer runs the engine: highlighting happens on the server.
      # The bindings are kept compiling so an in-browser engine can be wired back
      # in without resurrecting a build system for it.
      - name: Build the wasm bindings
        run: cargo build -p wintercave-wasm --target wasm32-unknown-unknown
