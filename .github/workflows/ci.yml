name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Web shell (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  rust:
    name: Rust core (fmt, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting diff
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo "already formatted"
          else
            echo "::error::rustfmt would rewrite the following code"
            git --no-pager diff
          fi
      - name: Tests
        run: cargo test --workspace --all-targets

  actix:
    name: Actix server (fmt, tests, live HTTP smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt -p wintercave-server -- --check
      - name: Unit and integration tests
        run: cargo test -p wintercave-server
      - name: Build the binary
        run: cargo build -p wintercave-server
      - name: Live HTTP smoke test
        run: node scripts/actix-smoke.mjs

  wasm:
    name: WebAssembly engine (build, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        run: command -v wasm-bindgen || cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: Build the engine
        run: npm run wasm:build
      - name: Smoke test the engine from JavaScript
        run: npm run wasm:smoke
      - name: Report bundle size
        run: du -h public/wasm/* && gzip -c public/wasm/wintercave_core_bg.wasm | wc -c
