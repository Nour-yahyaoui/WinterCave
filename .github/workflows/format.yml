name: Format

# Temporary helper: applies `cargo fmt --all` and pushes the result back to the
# working branch, because the authoring sandbox has no Rust toolchain. It also
# surfaces compiler diagnostics as check-run annotations.
on:
  workflow_dispatch:
  push:
    branches: [arena/90ed5d9f-wintercave]

jobs:
  fmt:
    name: rustfmt and diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/90ed5d9f-wintercave
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --all
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply rustfmt to the actix server"
          git push origin HEAD:arena/90ed5d9f-wintercave
      - name: Build and surface diagnostics
        run: |
          cargo build -p wintercave-server --message-format=short > /tmp/build.log 2>&1
          status=$?
          tail -n 120 /tmp/build.log | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          exit $status
      - name: Test and surface diagnostics
        run: |
          cargo test -p wintercave-server > /tmp/test.log 2>&1
          status=$?
          tail -n 120 /tmp/test.log | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          exit $status
