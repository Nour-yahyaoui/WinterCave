name: Format

# Temporary helper, deleted once the crate is green. Reports rustfmt's own output
# plus the first compiler/test errors as check-run annotations, because the
# authoring sandbox has no Rust toolchain.
on:
  workflow_dispatch:
  push:
    branches: [arena/90ed5d9f-wintercave]

jobs:
  fmt:
    name: rustfmt and diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: |
          if cargo fmt --all > /tmp/fmt.log 2>&1; then
            echo "::notice::rustfmt succeeded"
            git diff --stat || true
            exit 0
          fi
          printf '::error::FMT|%s\n' "$(head -c 3000 /tmp/fmt.log | tr '\n' ' ')"
          exit 1
      - name: Build diagnostics
        if: always()
        continue-on-error: true
        run: |
          cargo build -p wintercave-server --message-format=short > /tmp/build.log 2>&1 || true
          printf '::error::D|BUILD|%s\n' "$(grep -E 'error\[|error:' /tmp/build.log | head -n 12 | tr '\n' ' ' | cut -c1-3000)"
      - name: Test diagnostics
        if: always()
        continue-on-error: true
        run: |
          cargo test -p wintercave-server > /tmp/test.log 2>&1 || true
          printf '::error::D|TEST|%s\n' "$(grep -E '^(test .* FAILED|failures:|---- |thread |assertion|  left|  right)|panicked at|left ==|right ==' /tmp/test.log | head -n 40 | tr '\n' ' ' | cut -c1-3200)"
