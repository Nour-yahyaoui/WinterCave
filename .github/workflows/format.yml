name: Format

# Temporary helper, deleted once the actix crate is green. The authoring sandbox
# has no Rust toolchain, so CI formats the code and publishes each formatted file
# as a base64 annotation (FILE|<path>|<base64>) plus compiler/test diagnostics.
on:
  workflow_dispatch:
  push:
    branches: [arena/90ed5d9f-wintercave]

jobs:
  fmt:
    name: rustfmt and diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Publish formatted files
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo "::warning::already formatted, nothing to publish"
            exit 0
          fi
          for file in $(git diff --name-only); do
            printf '::error::FILE|%s|%s\n' "$file" "$(base64 -w0 "$file")"
          done
      - name: Build diagnostics
        continue-on-error: true
        run: |
          cargo build -p wintercave-server --message-format=short > /tmp/build.log 2>&1
          grep -E '^(error|warning)' /tmp/build.log | head -n 80 | while IFS= read -r line; do
            printf '::error::BUILD|%s\n' "$line"
          done
      - name: Test diagnostics
        continue-on-error: true
        run: |
          cargo test -p wintercave-server > /tmp/test.log 2>&1
          grep -E '^(error|test .* FAILED|failures:|---- )' /tmp/test.log | head -n 80 | while IFS= read -r line; do
            printf '::error::TEST|%s\n' "$line"
          done
