name: Format

# Temporary helper, deleted once the actix crate is green. The authoring sandbox
# has no Rust toolchain, so CI reports:
#   PKG|<total>|<index>|<chunk>  gzipped `cargo fmt` patch, base64, in chunks
#   D|<kind>|<text>              first compiler / test errors, flattened
on:
  workflow_dispatch:
  push:
    branches: [arena/90ed5d9f-wintercave]

jobs:
  fmt:
    name: rustfmt and diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting patch
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo "::warning::already formatted, nothing to publish"
            exit 0
          fi
          git diff > /tmp/fmt.patch
          encoded=$(gzip -c /tmp/fmt.patch | base64 -w0)
          length=$(printf '%s' "$encoded" | wc -c)
          total=$(( (length + 3700) / 3700 ))
          printf '%s' "$encoded" | fold -w 3700 | {
            index=0
            while IFS= read -r chunk; do
              printf '::error::PKG|%d|%04d|%s\n' "$total" "$index" "$chunk"
              index=$((index + 1))
            done
          }
      - name: Build diagnostics
        continue-on-error: true
        run: |
          cargo build -p wintercave-server --message-format=short > /tmp/build.log 2>&1 || true
          printf '::error::D|BUILD|%s\n' "$(grep -E 'error\[|error:' /tmp/build.log | head -n 12 | tr '\n' ' ' | cut -c1-3300)"
      - name: Test diagnostics
        continue-on-error: true
        run: |
          cargo test -p wintercave-server > /tmp/test.log 2>&1 || true
          printf '::error::D|TEST|%s\n' "$(grep -E 'error\[|error:|FAILED|panicked' /tmp/test.log | head -n 12 | tr '\n' ' ' | cut -c1-3300)"
