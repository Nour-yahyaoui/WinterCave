name: Format

# Temporary helper, deleted once the actix crate is green. The authoring sandbox
# has no Rust toolchain, so CI reports: the rustfmt result as a gzipped tar split
# into indexed base64 annotations (PKG|<total>|<index>|<chunk>), plus compiler
# and test diagnostics as D| annotations.
on:
  workflow_dispatch:
  push:
    branches: [arena/90ed5d9f-wintercave]

jobs:
  fmt:
    name: rustfmt and diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Publish formatted files
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo "::warning::already formatted, nothing to publish"
            exit 0
          fi
          tar -czf /tmp/fmt.tgz $(git diff --name-only)
          encoded=$(base64 -w0 /tmp/fmt.tgz)
          length=$(printf '%s' "$encoded" | wc -c)
          total=$(( (length + 2999) / 3000 ))
          printf '%s' "$encoded" | fold -w 3000 | {
            index=0
            while IFS= read -r chunk; do
              printf '::error::PKG|%d|%04d|%s\n' "$total" "$index" "$chunk"
              index=$((index + 1))
            done
          }
      - name: Build diagnostics
        continue-on-error: true
        run: |
          cargo build -p wintercave-server --message-format=short > /tmp/build.log 2>&1
          grep -E 'error\[|error:' /tmp/build.log | head -n 60 | while IFS= read -r line; do
            printf '::error::D|BUILD|%s\n' "$line"
          done
      - name: Test diagnostics
        continue-on-error: true
        run: |
          cargo test -p wintercave-server > /tmp/test.log 2>&1
          grep -E 'error\[|error:|FAILED|panicked' /tmp/test.log | head -n 60 | while IFS= read -r line; do
            printf '::error::D|TEST|%s\n' "$line"
          done
