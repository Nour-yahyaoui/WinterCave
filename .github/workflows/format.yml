name: Format

# Temporary helper, deleted once the actix crate is green. The authoring sandbox
# has no Rust toolchain, so CI does the formatting and reports it as a patch in
# check-run annotations, together with any compiler and test diagnostics.
on:
  workflow_dispatch:
  push:
    branches: [arena/90ed5d9f-wintercave]

jobs:
  fmt:
    name: rustfmt and diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting patch
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo "::warning::already formatted"
          else
            git diff > /tmp/fmt.patch
            echo "::warning::rustfmt changed files, see annotations for the patch"
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < /tmp/fmt.patch
          fi
      - name: Build diagnostics
        continue-on-error: true
        run: |
          cargo build -p wintercave-server --message-format=short > /tmp/build.log 2>&1
          tail -n 150 /tmp/build.log | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
      - name: Test diagnostics
        continue-on-error: true
        run: |
          cargo test -p wintercave-server > /tmp/test.log 2>&1
          tail -n 150 /tmp/test.log | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
